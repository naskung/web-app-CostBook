name: costbook
description: "CostBook — คำนวณต้นทุน ใบกำกับภาษี รายรับ-รายจ่าย และ stock"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  http: ^1.6.0
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.3.0

dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/lang/

  fonts:
    - family: LINESeedSansTH
      fonts:
        - asset: assets/fonts/LINESeedSansTH_A_Th.ttf
          weight: 100
        - asset: assets/fonts/LINESeedSansTH_A_Rg.ttf
          weight: 400
        - asset: assets/fonts/LINESeedSansTH_A_Bd.ttf
          weight: 700
        - asset: assets/fonts/LINESeedSansTH_A_XBd.ttf
          weight: 800
        - asset: assets/fonts/LINESeedSansTH_A_He.ttf
          weight: 900
